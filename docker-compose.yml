version: '3.8'

services:
  api:
    build:
      context: ./Phase2
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./Phase2:/app
      - ./output:/app/output
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-sse:
    build:
      context: ./Phase2
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - API_BASE_URL=http://api:8000
      - PYTHONPATH=/app
    command: ["python", "mcp_server/server.py", "--transport", "sse", "--port", "8001"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  output:
